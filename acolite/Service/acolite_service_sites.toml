## example for a date range from today
[Blankaart]
name = "Blankaart"
station_lat = 50.988265
station_lon = 2.830296
station_box_size = 3
output = "$HOME/$SITE"
n_days = 3
sources = ["Landsat", "Sentinel-2"]
